name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O client do Prisma é gerado (não versionado), então precisa existir
      # antes do typecheck. Não exige DATABASE_URL: o schema declara a datasource
      # sem url, que só é resolvida em runtime via prisma.config.ts.
      - name: Gerar client do Prisma
        run: npx prisma generate

      - name: Testes
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # `--max-warnings 0` porque hoje estamos em zero: deixar aviso passar é
      # como se acostuma a ignorá-los. `--report-unused-disable-directives`
      # impede que um `eslint-disable` sobreviva depois de deixar de ser
      # necessário, virando permissão silenciosa.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
